name: Deploy Flutter Web To Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-prod
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze lib

      - name: Build Web Prod
        working-directory: app
        run: flutter build web --release --dart-define=APP_ENV=prod --pwa-strategy=none

      - name: Disable stale Flutter service worker cache
        shell: bash
        run: |
          cat > app/build/web/flutter_service_worker.js <<'EOF'
          self.addEventListener('install', (event) => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              if (self.registration && self.registration.unregister) {
                await self.registration.unregister();
              }
              const clientsList = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
              for (const client of clientsList) {
                client.navigate(client.url);
              }
            })());
          });

          self.addEventListener('fetch', () => {});
          EOF

      - name: Deploy To Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATIMATCH_APP_2026_BERKAY }}
          channelId: live
          projectId: patimatch-app-2026-berkay
